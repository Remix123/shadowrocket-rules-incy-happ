name: Convert and publish INCY routing profiles

on:
  workflow_dispatch:
  schedule:
    # Upstream rebuilds at 08:00 Beijing; run at 10:30 Beijing.
    - cron: "30 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out converter
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate converter
        run: python -m unittest discover -s tests -v

      - name: Convert upstream profiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/convert.py --output site

      - name: Refresh README profile links
        run: python scripts/update_readme.py --manifest site/manifest.json --readme README.md

      - name: Commit README profile link changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README profile links are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: refresh generated profile links"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
